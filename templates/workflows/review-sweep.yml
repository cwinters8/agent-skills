# Vendored by @cwinters8/agent-skills — edit upstream, then re-run the sync.
#
# This file only says WHEN to sweep. The loop itself lives in the package, so a
# fix there reaches this repo when `agent-skills sync` bumps the ref below, with
# no change to this file's contents.
#
# Configure it with repository or organization variables, not by editing here: a
# hand-edited vendored file makes every later sync refuse until you revert it.
#
#   AGENT_SKILLS_REVIEW_BOTS   comma-separated bot logins whose comments should
#                              start a sweep, e.g. your code-review bot. Unset
#                              means human reviewers only.
#   AGENT_SKILLS_REVIEW_MODEL  optional model override.
#   AGENT_SKILLS_RUNNER        optional runner label, for self-hosted runners.
#   AGENT_SKILLS_MAX_TURNS     optional turn ceiling per run (default 40).
#   AGENT_SKILLS_SWEEP_SCHEDULE  set to "on" to enable the daily backstop sweep.
#
# To store no credential at all, set these three variables instead of the secret
# and the runner exchanges its GitHub OIDC token for API access. None of them is
# secret, so an organization can share them as organization variables — which is
# the one way to avoid a per-repository copy on a personal account:
#
#   ANTHROPIC_FEDERATION_RULE_ID   fdrl_...
#   ANTHROPIC_ORGANIZATION_ID      your Anthropic organization ID
#   ANTHROPIC_WORKSPACE_ID         optional, wrkspc_...
#
# Or keep the credential in Doppler and let the run fetch it by OIDC, which
# stores nothing in GitHub either:
#
#   DOPPLER_IDENTITY_ID            service account identity UUID
#   DOPPLER_PROJECT                project holding the credential
#   DOPPLER_CONFIG                 config within that project
#   DOPPLER_SECRET_NAME            optional; the Doppler secret holding a
#                                  subscription token, if not named
#                                  CLAUDE_CODE_OAUTH_TOKEN
#   DOPPLER_API_KEY_NAME           optional; same, for an API key stored under
#                                  a name other than ANTHROPIC_API_KEY
#
# The run needs a credential, by exactly one of three routes. A stored Actions
# secret named CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) — those are
# repository, environment or organization scoped, with no user-account-level
# one, so an organization can share a single secret and a personal account needs
# one per repo. Or either of the two routes below, which store nothing.
#
# If you need different triggers than these, drop "review-sweep" from the
# "workflows" array in .claude/skills.json and keep your own copy. The sync will
# stop writing this file and leave yours alone.
name: review sweep

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to sweep. Empty sweeps every open PR.
        type: string
        required: false
  # A backstop for the states no event announces: a reviewer who signals with a
  # reaction rather than a comment, or a webhook that never arrived. Inert
  # unless AGENT_SKILLS_SWEEP_SCHEDULE is set to "on" — the cron fires and the
  # job's condition declines it, which costs nothing. This is the project
  # configuring a routine once, the supported way to get recurrence, rather than
  # a session arming a poll for itself.
  schedule:
    - cron: "17 8 * * *"

jobs:
  sweep:
    # A called workflow cannot hold more than its caller grants, and none of
    # these are in the default token: without this block the nested job is
    # refused before any step runs. They match the called workflow exactly —
    # write to push review fixes, to reply and resolve threads, and to comment;
    # id-token for the keyless auth routes; actions:read to see CI on the PRs
    # being swept.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Two things to keep out. Comments on plain issues, which are the same event
    # as PR conversation comments and carry no PR to sweep. And the agent's own
    # replies: the skill answers threads as it triages them, and each reply is
    # another comment event. The action would reject those runs itself, on its
    # bot-actor check — but a rejected run is a failed run, so every reply the
    # agent posts would leave a red X on the repo. Cheaper to not start.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.AGENT_SKILLS_SWEEP_SCHEDULE == 'on') ||
      ((github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
       github.actor != 'claude[bot]' &&
       (github.actor != 'github-actions[bot]' ||
        contains(vars.AGENT_SKILLS_REVIEW_BOTS, 'github-actions[bot]')))
    uses: cwinters8/agent-skills/.github/workflows/review-sweep.yml@__AGENT_SKILLS_REF__
    with:
      # The event names the PR it happened on, so sweep that one rather than
      # every open PR. Review events carry pull_request, PR conversation
      # comments carry issue; a manual dispatch passes its own, and an empty
      # value still means "sweep everything".
      pr: >-
        ${{ inputs.pr
            || github.event.pull_request.number
            || github.event.issue.number
            || '' }}
      allowed-bots: ${{ vars.AGENT_SKILLS_REVIEW_BOTS }}
      model: ${{ vars.AGENT_SKILLS_REVIEW_MODEL }}
      runs-on: ${{ vars.AGENT_SKILLS_RUNNER || 'ubuntu-latest' }}
      max-turns: ${{ vars.AGENT_SKILLS_MAX_TURNS && fromJSON(vars.AGENT_SKILLS_MAX_TURNS) || 40 }}
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
      doppler-project: ${{ vars.DOPPLER_PROJECT }}
      doppler-config: ${{ vars.DOPPLER_CONFIG }}
      doppler-oauth-token-name: ${{ vars.DOPPLER_SECRET_NAME || 'CLAUDE_CODE_OAUTH_TOKEN' }}
      doppler-api-key-name: ${{ vars.DOPPLER_API_KEY_NAME || 'ANTHROPIC_API_KEY' }}
    # Named rather than `inherit`. Inheriting is documented as working for a
    # called workflow in the same organization or enterprise, and this one is in
    # neither for most consumers — a personal account is not an organization at
    # all — so `inherit` would silently pass nothing and the stored-secret route
    # would fail with an empty credential. A secret that does not exist resolves
    # to an empty string, which is what the other two routes already expect.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
