# Vendored by @cwinters8/agent-skills — edit upstream, then re-run the sync.
#
# This file only says WHEN to sweep. The loop itself lives in the package, so a
# fix there reaches this repo when `agent-skills sync` bumps the ref below, with
# no change to this file's contents.
#
# Configure it with repository or organization variables, not by editing here: a
# hand-edited vendored file makes every later sync refuse until you revert it.
#
#   AGENT_SKILLS_REVIEW_BOTS   comma-separated bot logins whose comments should
#                              start a sweep, e.g. your code-review bot. Unset
#                              means human reviewers only.
#   AGENT_SKILLS_REVIEW_MODEL  optional model override.
#
# To store no credential at all, set these three variables instead of the secret
# and the runner exchanges its GitHub OIDC token for API access. None of them is
# secret, so an organization can share them as organization variables — which is
# the one way to avoid a per-repository copy on a personal account:
#
#   ANTHROPIC_FEDERATION_RULE_ID   fdrl_...
#   ANTHROPIC_ORGANIZATION_ID      your Anthropic organization ID
#   ANTHROPIC_WORKSPACE_ID         optional, wrkspc_...
#
# Or keep the credential in Doppler and let the run fetch it by OIDC, which
# stores nothing in GitHub either. Set all three, and name the Doppler secret
# CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY):
#
#   DOPPLER_IDENTITY_ID            service account identity UUID
#   DOPPLER_PROJECT                project holding the credential
#   DOPPLER_CONFIG                 config within that project
#
# Needs a CLAUDE_CODE_OAUTH_TOKEN Actions secret (`claude setup-token`). Actions
# secrets are repository, environment or organization scoped — there is no
# user-account-level one — so a repo owned by an organization can share a single
# organization secret, and a repo owned by a personal account needs its own.
#
# If you need different triggers than these, drop "review-sweep" from the
# "workflows" array in .claude/skills.json and keep your own copy. The sync will
# stop writing this file and leave yours alone.
name: review sweep

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to sweep. Empty sweeps every open PR.
        type: string
        required: false

jobs:
  sweep:
    # Two things to keep out. Comments on plain issues, which are the same event
    # as PR conversation comments and carry no PR to sweep. And the agent's own
    # replies: the skill answers threads as it triages them, and each reply is
    # another comment event. The action would reject those runs itself, on its
    # bot-actor check — but a rejected run is a failed run, so every reply the
    # agent posts would leave a red X on the repo. Cheaper to not start.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
       github.actor != 'claude[bot]' &&
       github.actor != 'github-actions[bot]')
    uses: cwinters8/agent-skills/.github/workflows/review-sweep.yml@__AGENT_SKILLS_REF__
    with:
      pr: ${{ inputs.pr || '' }}
      allowed-bots: ${{ vars.AGENT_SKILLS_REVIEW_BOTS }}
      model: ${{ vars.AGENT_SKILLS_REVIEW_MODEL }}
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
      doppler-project: ${{ vars.DOPPLER_PROJECT }}
      doppler-config: ${{ vars.DOPPLER_CONFIG }}
    secrets: inherit
